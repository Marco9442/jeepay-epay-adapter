# OrbStack 开发堆栈：mock-newapi ↔ adapter ↔ mock-jeepay
name: jeepay-epay-dev

services:
  mock-jeepay:
    build:
      context: .
      target: mock-jeepay
    environment:
      HTTP_ADDR: ":9216"
      PUBLIC_BASE_URL: http://127.0.0.1:19216
      JEEPAY_MCH_NO: M1680000001
      JEEPAY_APP_ID: 60cc09bce4b0f1c0b83761c9
      JEEPAY_APP_SECRET: jeepay-dev-app-secret
    ports:
      - "19216:9216"

  adapter:
    build:
      context: .
      target: adapter
    depends_on:
      mock-jeepay:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: http://127.0.0.1:18080
      INTERNAL_BASE_URL: http://adapter:8080
      EPAY_PID: "1000"
      EPAY_KEY: dev-epay-key
      JEEPAY_BASE_URL: http://mock-jeepay:9216
      JEEPAY_MCH_NO: M1680000001
      JEEPAY_APP_ID: 60cc09bce4b0f1c0b83761c9
      JEEPAY_APP_SECRET: jeepay-dev-app-secret
      JEEPAY_WAY_CODE_WXPAY: WX_NATIVE
      SQLITE_PATH: /data/adapter.db
      NOTIFY_INTERVAL_SEC: "2"
    volumes:
      - adapter-dev-data:/data
    ports:
      - "18080:8080"

  mock-newapi:
    build:
      context: .
      target: mock-newapi
    depends_on:
      adapter:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":3001"
      PUBLIC_BASE_URL: http://127.0.0.1:13001
      NOTIFY_BASE_URL: http://mock-newapi:3001
      EPAY_PAY_ADDRESS: http://127.0.0.1:18080
      EPAY_PID: "1000"
      EPAY_KEY: dev-epay-key
    ports:
      - "13001:3001"

volumes:
  adapter-dev-data:

# 合并进 main 后并行发布：GHCR 构建推送，同时把代码推到 CNB 并触发那边的镜像构建。
name: 发布镜像

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 GHCR
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          img="ghcr.io/${owner}"
          sha="$(git rev-parse --short HEAD)"
          src="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker build \
            --target adapter \
            --label "org.opencontainers.image.source=${src}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --label "org.opencontainers.image.title=jeepay-epay-adapter" \
            -t "${img}:latest" \
            -t "${img}:sha-${sha}" \
            .
          docker push "${img}:latest"
          docker push "${img}:sha-${sha}"

      - name: 公开 GHCR 包
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          for _ in 1 2 3 4 5; do
            if gh api --method PUT \
              "/users/${owner}/packages/container/${name}/visibility" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "包已推送，若仍是私有，在 GitHub Packages 里改一次可见性即可。"

  cnb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_REPO: ${{ vars.CNB_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 CNB 并触发构建
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "缺少 GitHub Secret: CNB_TOKEN" >&2
            exit 1
          fi
          if [ -z "${CNB_REPO}" ]; then
            echo "缺少 GitHub Variable: CNB_REPO，例如 baorui.xyz/jeepay-epay-adapter" >&2
            exit 1
          fi

          api="https://api.cnb.cool"
          auth() {
            curl -sS "$@" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json"
          }

          group="${CNB_REPO%/*}"
          name="${CNB_REPO##*/}"
          code="$(curl -sS -o /tmp/cnb-repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/json" \
            "${api}/${CNB_REPO}")"
          if [ "$code" = "404" ]; then
            echo "创建 CNB 仓库 ${CNB_REPO}"
            auth -X POST "${api}/${group}/-/repos" \
              -d "{\"name\":\"${name}\",\"visibility\":\"public\",\"description\":\"易支付到 Jeepay 的独立适配器\"}"
          elif [ "$code" != "200" ]; then
            echo "查询 CNB 仓库失败 HTTP ${code}" >&2
            cat /tmp/cnb-repo.json >&2 || true
            exit 1
          fi

          git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}" "HEAD:refs/heads/main"

          # push 会走 .cnb.yml 的 main.push；再补一次 API，避免空仓库首推没建起来
          curl -sS -o /tmp/cnb-build.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${api}/${CNB_REPO}/-/build/start" \
            -d "{\"event\":\"api_trigger\",\"branch\":\"main\",\"title\":\"release from github\"}" \
            >/tmp/cnb-build.code
          echo "CNB 构建触发 HTTP $(cat /tmp/cnb-build.code)"
          python3 -c 'import json; d=json.load(open("/tmp/cnb-build.json")); print("sn", d.get("sn") or ""); print("url", d.get("buildLogUrl") or "")' || cat /tmp/cnb-build.json | head -c 400
          echo

# 合并进 main 后按 VERSION 发固定版本镜像：GHCR 构建推送，同时把代码推到 CNB 并触发那边的构建。
name: 发布镜像

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: ver
        name: 读取并锁定版本
        run: |
          set -euo pipefail
          raw="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION 必须是 x.y.z，当前是: ${raw}" >&2
            exit 1
          fi
          ver="v${raw}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          head="$(git rev-parse HEAD)"
          remote="$(git ls-remote --tags origin "refs/tags/${ver}" | awk '{print $1}')"
          if [ -n "$remote" ]; then
            if [ "$remote" = "$head" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "版本 ${ver} 已是当前提交，跳过发布。"
              exit 0
            fi
            echo "VERSION ${raw} 已发布在 ${remote}，本次是 ${head}。请改 VERSION。" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$ver"
          git push origin "refs/tags/${ver}"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  ghcr:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 GHCR
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          img="ghcr.io/${owner}"
          src="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker build \
            --target adapter \
            --label "org.opencontainers.image.source=${src}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --label "org.opencontainers.image.title=jeepay-epay-adapter" \
            -t "${img}:${VERSION}" \
            .
          docker push "${img}:${VERSION}"

      - name: 公开 GHCR 包
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          for _ in 1 2 3 4 5; do
            if gh api --method PUT \
              "/users/${owner}/packages/container/${name}/visibility" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "包已推送，若仍是私有，在 GitHub Packages 里改一次可见性即可。"

  cnb:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_REPO: ${{ vars.CNB_REPO }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 推送到 CNB 并触发构建
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "缺少 GitHub Secret: CNB_TOKEN" >&2
            exit 1
          fi
          if [ -z "${CNB_REPO}" ]; then
            echo "缺少 GitHub Variable: CNB_REPO，例如 baorui.xyz/jeepay-epay-adapter" >&2
            exit 1
          fi

          api="https://api.cnb.cool"
          auth() {
            curl -sS "$@" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json"
          }

          group="${CNB_REPO%/*}"
          name="${CNB_REPO##*/}"
          code="$(curl -sS -o /tmp/cnb-repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/json" \
            "${api}/${CNB_REPO}")"
          if [ "$code" = "404" ]; then
            echo "创建 CNB 仓库 ${CNB_REPO}"
            auth -X POST "${api}/${group}/-/repos" \
              -d "{\"name\":\"${name}\",\"visibility\":\"public\",\"description\":\"易支付到 Jeepay 的独立适配器\"}"
          elif [ "$code" != "200" ]; then
            echo "查询 CNB 仓库失败 HTTP ${code}" >&2
            cat /tmp/cnb-repo.json >&2 || true
            exit 1
          fi

          remote="https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}"
          git push --force "$remote" "HEAD:refs/heads/main"
          git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}" || true
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            git push "$remote" "refs/tags/${VERSION}"
          fi

          curl -sS -o /tmp/cnb-build.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${api}/${CNB_REPO}/-/build/start" \
            -d "{\"event\":\"api_trigger\",\"branch\":\"main\",\"title\":\"release ${VERSION}\"}" \
            >/tmp/cnb-build.code
          echo "CNB 构建触发 HTTP $(cat /tmp/cnb-build.code)"
          python3 -c 'import json; d=json.load(open("/tmp/cnb-build.json")); print("sn", d.get("sn") or ""); print("url", d.get("buildLogUrl") or "")' || cat /tmp/cnb-build.json | head -c 400
          echo

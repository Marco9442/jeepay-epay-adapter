# GitHub 在发布新版本时触发。镜像只打 VERSION 对应的 vX.Y.Z，不打 latest。
# 在 amd64 节点构建。生产只拉这份 CNB 镜像。

$:
  api_trigger:
    - name: 构建并发布镜像
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      stages:
        - name: 构建并推送
          script: |
            set -eu
            uname -m | grep -qx x86_64
            REG="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VER="v$(tr -d '[:space:]' < VERSION)"
            echo "$VER" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            docker build \
              --platform linux/amd64 \
              --target adapter \
              --build-arg GOPROXY=https://goproxy.cn,direct \
              --label "org.opencontainers.image.source=https://github.com/Marco9442/jeepay-epay-adapter" \
              --label "org.opencontainers.image.revision=${CNB_COMMIT}" \
              --label "org.opencontainers.image.version=${VER}" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
              -t "${REG}:${VER}" \
              .
            arch="$(docker image inspect --format '{{.Architecture}}' "${REG}:${VER}")"
            echo "architecture ${arch}"
            [ "$arch" = "amd64" ]
            docker push "${REG}:${VER}"

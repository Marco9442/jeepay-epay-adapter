# 从 CNB 拉真实 Jeepay。无微信证书时不要把适配器指到这里，WX_NATIVE 会在渠道层失败。
# 用于确认镜像可运行、商户 API 可达。fresh DB 只跑 init.sql，不要再跑历史 patch。
name: jeepay-epay-realjeepay

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: jeepaydb
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    volumes:
      - jeepay-mysql:/var/lib/mysql
      - ./deploy/jeepay/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deploy/jeepay/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rocketmq-namesrv:
    platform: linux/amd64
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    environment:
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9876'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  rocketmq-broker:
    platform: linux/amd64
    image: apache/rocketmq:5.3.1
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -n rocketmq-namesrv:9876
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10911'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  payment:
    platform: linux/amd64
    image: docker.cnb.cool/baorui.xyz/jeepay/jeepay-payment:v3.2.0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    ports:
      - "19218:9216"
    volumes:
      - ./deploy/jeepay/conf/payment.yml:/jeepayhomes/service/app/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9216'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 50s

  manager:
    platform: linux/amd64
    image: docker.cnb.cool/baorui.xyz/jeepay/jeepay-manager:v3.2.0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    ports:
      - "19217:9217"
    volumes:
      - ./deploy/jeepay/conf/manager.yml:/jeepayhomes/service/app/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9217'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 50s

volumes:
  jeepay-mysql:

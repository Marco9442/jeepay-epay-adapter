<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信支付</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7f8; color: #1f2328; }
    main { max-width: 420px; margin: 48px auto; background: #fff; border-radius: 16px; padding: 28px 24px 32px; box-shadow: 0 8px 30px rgba(31,35,40,.06); text-align: center; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .money { font-size: 32px; font-weight: 650; margin: 8px 0 20px; }
    img { width: 220px; height: 220px; border-radius: 8px; }
    .hint { color: #656d76; font-size: 14px; line-height: 1.6; }
    .status { margin-top: 16px; font-size: 14px; }
    a { color: #1f883d; }
  </style>
</head>
<body>
<main>
  <h1>请使用微信扫码支付</h1>
  <div class="money">¥ {{.Money}}</div>
  <img src="/pay/{{.TradeNo}}/qr.png" alt="支付二维码">
  <p class="hint">支付完成后本页会自动跳转。若二维码无法识别，可<a href="{{.PayData}}" rel="noopener">打开支付链接</a>。</p>
  <p class="status" id="status">等待支付…</p>
</main>
<script>
  const tradeNo = {{.TradeNoJSON}};
  async function poll() {
    try {
      const r = await fetch("/pay/" + tradeNo + "/status");
      const j = await r.json();
      if (j.state === "paid") {
        document.getElementById("status").textContent = "支付成功，正在跳转…";
        location.replace("/pay/" + tradeNo + "/return");
        return;
      }
      if (j.state === "failed") {
        document.getElementById("status").textContent = "支付未完成";
      }
    } catch (e) {}
    setTimeout(poll, 1500);
  }
  poll();
</script>
</body>
</html>
